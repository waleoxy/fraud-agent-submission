<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>HairVault fraud investigation agent architecture</title>
  <desc>A flagged transaction triggers a Gemini agent orchestrator running on Cloud Run, which calls four tools against existing HairVault services, then writes an audit log and resolution output.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="380" fill="#ffffff"/>

  <!-- Trigger -->
  <rect x="210" y="20" width="260" height="44" rx="8" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1"/>
  <text x="340" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Flagged transaction</text>
  <text x="340" y="53" text-anchor="middle" font-size="11" fill="#495057">BullMQ queue · HairVault ERP</text>
  <line x1="340" y1="64" x2="340" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="180" y="100" width="320" height="56" rx="8" fill="#eee3fb" stroke="#9775e6" stroke-width="1"/>
  <text x="340" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Gemini agent orchestrator</text>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#495057">Genkit + Vertex AI · deployed on Cloud Run</text>

  <!-- Fan-out to 4 tools -->
  <path d="M340 156 L340 180 L100 180 L100 200" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M340 156 L340 180 L260 180 L260 200" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M340 156 L340 180 L420 180 L420 200" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M340 156 L340 180 L580 180 L580 200" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Tools -->
  <rect x="30" y="200" width="140" height="56" rx="8" fill="#d7f5ee" stroke="#38b891" stroke-width="1"/>
  <text x="100" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">Related history</text>
  <text x="100" y="240" text-anchor="middle" font-size="10.5" fill="#495057">Cloud SQL query</text>

  <rect x="190" y="200" width="140" height="56" rx="8" fill="#d7f5ee" stroke="#38b891" stroke-width="1"/>
  <text x="260" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">Counterparty check</text>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#495057">External API call</text>

  <rect x="350" y="200" width="140" height="56" rx="8" fill="#d7f5ee" stroke="#38b891" stroke-width="1"/>
  <text x="420" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">Ledger update</text>
  <text x="420" y="240" text-anchor="middle" font-size="10.5" fill="#495057">Postgres write</text>

  <rect x="510" y="200" width="140" height="56" rx="8" fill="#d7f5ee" stroke="#38b891" stroke-width="1"/>
  <text x="580" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">Alert dispatch</text>
  <text x="580" y="240" text-anchor="middle" font-size="10.5" fill="#495057">Slack / email API</text>

  <!-- Converge to audit log -->
  <path d="M100 256 L100 280 L340 280 L340 300" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M260 256 L260 280 L340 280 L340 300" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M420 256 L420 280 L340 280 L340 300" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M580 256 L580 280 L340 280 L340 300" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Audit log -->
  <rect x="140" y="300" width="400" height="56" rx="8" fill="#fff3d6" stroke="#e0a415" stroke-width="1"/>
  <text x="340" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Audit log + resolution output</text>
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#495057">Firestore · Cloud Logging · reasoning trace</text>
</svg>
